services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: gsc-study:latest
    container_name: gsc-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # DATABASE_URL: postgresql://gsc:${POSTGRES_PASSWORD}@db:5432/gsc
      # BITRIX_WEBHOOK_URL: ${BITRIX_WEBHOOK_URL}
    expose:
      - "3000"
    # depends_on:
    #   - db
    networks:
      - web

  nginx:
    image: nginx:alpine
    container_name: gsc-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certbot/www:/var/www/certbot:ro
      - ./nginx/certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - app
    networks:
      - web

  # Раскомментировать, когда подключим БД (Prisma):
  # db:
  #   image: postgres:16-alpine
  #   container_name: gsc-db
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_USER: gsc
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  #     POSTGRES_DB: gsc
  #   volumes:
  #     - pgdata:/var/lib/postgresql/data
  #   networks:
  #     - web

networks:
  web:
    driver: bridge

