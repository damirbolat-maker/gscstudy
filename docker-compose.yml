services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: gsc-study:latest
    container_name: gsc-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # SQLite-файл лежит в томе ./data/db (переживает пересборку образа)
      DATABASE_URL: "file:/app/data/prod.db"
    # Секреты (ADMIN_PASSWORD, AUTH_SECRET, BITRIX_WEBHOOK_URL) — из .env на сервере
    env_file:
      - .env
    expose:
      - "3000"
    volumes:
      # База данных SQLite
      - ./data/db:/app/data
      # Загруженные из админки фото
      - ./data/uploads:/app/public/uploads
    networks:
      - web

  nginx:
    image: nginx:alpine
    container_name: gsc-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certbot/www:/var/www/certbot:ro
      - ./nginx/certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - app
    networks:
      - web

  # Раскомментировать, когда подключим БД (Prisma):
  # db:
  #   image: postgres:16-alpine
  #   container_name: gsc-db
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_USER: gsc
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  #     POSTGRES_DB: gsc
  #   volumes:
  #     - pgdata:/var/lib/postgresql/data
  #   networks:
  #     - web

networks:
  web:
    driver: bridge

