# GSC Study — Nginx reverse proxy
# ЗАМЕНИТЬ gscstudy.kz на реальный домен.

server {
    listen 80;
    server_name gscstudy.kz www.gscstudy.kz;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # После выпуска сертификата раскомментировать редирект на HTTPS:
    # location / {
    #     return 301 https://$host$request_uri;
    # }

    # До выпуска сертификата — проксируем напрямую:
    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

