name: Build and deploy (single archive over FTP)

# Сборка на GitHub Actions и доставка ОДНИМ архивом по FTP.
# Заливать тысячи файлов node_modules по FTP невозможно долго, поэтому
# упаковываем всё приложение в один .zip и грузим одним файлом.
# На хостинге архив распаковывается в Plesk (Файлы → Извлечь).

on:
  workflow_dispatch:

concurrency:
  group: deploy-ftp
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build

      - name: Build seeded DB template (prod.db.seed)
        run: |
          DATABASE_URL="file:./prod.db.seed" npx prisma db push --skip-generate
          DATABASE_URL="file:./prod.db.seed" node prisma/seed.mjs

      - name: Keep only runtime dependencies
        run: npm prune --omit=dev

      - name: Regenerate Prisma client (multi-target engines)
        run: npx prisma generate

      - name: Passenger restart marker
        run: |
          mkdir -p tmp
          date > tmp/restart.txt

      - name: Package app into a single archive
        run: |
          zip -r -q -y gsc-app.zip \
            node_modules .next public prisma server.js package.json \
            package-lock.json next.config.mjs tmp \
            -x 'prisma/prod.db' 'prisma/*.db-journal' 'public/uploads/*'
          ls -lh gsc-app.zip

      - name: Upload the archive (single file, fast)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          # Путь к папке домена относительно домашней (убираем ведущие/хвостовые слэши)
          DIR=$(printf '%s' "$FTP_SERVER_DIR" | sed 's:^/*::; s:/*$::')
          echo "Целевая папка из секрета FTP_SERVER_DIR: '$DIR'"
          # Не прерываемся на неуспешной команде (cmd:fail-exit no), чтобы
          # сначала снять диагностику: где реально находится домашняя папка FTP
          # и где лежит каталог приложения. Затем кладём архив в нужное место.
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" -e "
            set ftp:ssl-allow no;
            set net:timeout 30;
            set net:max-retries 5;
            set net:reconnect-interval-base 5;
            set xfer:clobber on;
            set cmd:fail-exit no;
            echo '=== HOME (pwd) ===';
            pwd;
            echo '=== СОДЕРЖИМОЕ HOME ===';
            cls -l;
            echo '=== ПОДПАПКИ HOME ===';
            cls -d */;
            echo '=== Пробую cd в целевую папку ===';
            cd \"$DIR\" && echo 'OK: перешёл в целевую папку' && pwd || echo 'НЕ УДАЛОСЬ перейти в целевую папку — заливаю в HOME';
            echo '=== Заливаю архив в текущую папку ===';
            put gsc-app.zip;
            echo '=== Проверка после заливки (pwd + файл) ===';
            pwd;
            cls -l gsc-app.zip;
            bye
          "
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
